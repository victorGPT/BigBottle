name: Export Rewards Secrets Artifact

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'Artifact name for the one-time rewards env export'
        required: true
        type: string
      nonce:
        description: 'One-time nonce for auditability'
        required: true
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      VECHAIN_NETWORK_SECRET: ${{ secrets.VECHAIN_NETWORK }}
      VECHAIN_NODE_URL_SECRET: ${{ secrets.VECHAIN_NODE_URL }}
      VEBETTER_APP_ID_SECRET: ${{ secrets.VEBETTER_APP_ID }}
      X2EARN_REWARDS_POOL_ADDRESS_SECRET: ${{ secrets.X2EARN_REWARDS_POOL_ADDRESS }}
      FEE_DELEGATION_URL_SECRET: ${{ secrets.FEE_DELEGATION_URL }}
      REWARD_DISTRIBUTOR_PRIVATE_KEY_SECRET: ${{ secrets.REWARD_DISTRIBUTOR_PRIVATE_KEY }}
      VEBETTER_CURRENT_EFFECTIVE_ROUND_ID_VAR: ${{ vars.VEBETTER_CURRENT_EFFECTIVE_ROUND_ID }}
    steps:
      - name: Write masked rewards env
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys

          values = {
              "REWARDS_MODE": "chain",
              "VECHAIN_NETWORK": os.environ.get("VECHAIN_NETWORK_SECRET", ""),
              "VECHAIN_NODE_URL": os.environ.get("VECHAIN_NODE_URL_SECRET", ""),
              "VEBETTER_APP_ID": os.environ.get("VEBETTER_APP_ID_SECRET", ""),
              "X2EARN_REWARDS_POOL_ADDRESS": os.environ.get("X2EARN_REWARDS_POOL_ADDRESS_SECRET", ""),
              "FEE_DELEGATION_URL": os.environ.get("FEE_DELEGATION_URL_SECRET", ""),
              "REWARD_DISTRIBUTOR_PRIVATE_KEY": os.environ.get("REWARD_DISTRIBUTOR_PRIVATE_KEY_SECRET", ""),
              "VEBETTER_CURRENT_EFFECTIVE_ROUND_ID": os.environ.get("VEBETTER_CURRENT_EFFECTIVE_ROUND_ID_VAR", ""),
          }

          required = [
              "VECHAIN_NETWORK",
              "VEBETTER_APP_ID",
              "X2EARN_REWARDS_POOL_ADDRESS",
              "FEE_DELEGATION_URL",
              "REWARD_DISTRIBUTOR_PRIVATE_KEY",
          ]
          missing = [key for key in required if not values[key]]
          if missing:
              print(f"Missing required rewards secrets: {', '.join(missing)}", file=sys.stderr)
              sys.exit(1)

          for value in values.values():
              if value:
                  if "\n" in value or "\r" in value:
                      print("Secret values must be single-line for dotenv export.", file=sys.stderr)
                      sys.exit(1)
                  print(f"::add-mask::{value}")

          with open("aws-rewards-secrets.env", "w", encoding="utf-8") as file:
              file.write("# One-time rewards secrets export for AWS self-hosted Supabase.\n")
              for key, value in values.items():
                  if value:
                      file.write(f"{key}={value}\n")
          PY

      - name: Upload one-time artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: aws-rewards-secrets.env
          if-no-files-found: error
          retention-days: 1
