name: Supabase API Public Routes Guard

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Optional API base URL override
        required: false
        type: string

jobs:
  public-routes-guard:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.SUPABASE_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure public auth routes stay public
        run: |
          set -euo pipefail
          if [[ -z "${API_BASE_URL:-}" ]]; then
            echo "API_BASE_URL is empty. Please set repository variable SUPABASE_API_BASE_URL." >&2
            exit 1
          fi
          bash scripts/ci/check_supabase_public_auth_routes.sh "${API_BASE_URL}"
